version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: ai-code-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicode
      POSTGRES_PASSWORD: aicode123
      POSTGRES_DB: ai_code_platform
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # Map to port 5433 on host to avoid conflict
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicode"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-code-platform-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Map to port 6380 on host to avoid conflict
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

