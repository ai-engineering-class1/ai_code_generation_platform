version: '3.8'

services:
  backend:
    build: ./backend
    container_name: Lee-ai-code-platform-backend
    restart: unless-stopped
    ports:
      - "4531:8000"
    networks:
      - Lee-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Connect to the external database on the host machine
      - POSTGRES_SERVER=host.docker.internal
      - POSTGRES_PORT=4501
      # Connect to the external redis on the host machine
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=4502
      # Ensure CORS allows our new frontend port
      - CORS_ORIGINS=["http://localhost:4530","http://127.0.0.1:4530","http://localhost:3012","http://103.98.213.149:4530"]
      # Keep other credentials managed by the app's .env or add them here if needed
      - POSTGRES_USER=aicode
      - POSTGRES_PASSWORD=aicode123
      - POSTGRES_DB=ai_code_platform
      # Claude CLI Configuration
      - CLAUDE_EXECUTABLE_PATH=claude
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_BASE_URL=https://open.bigmodel.cn/api/anthropic
      - API_TIMEOUT_MS=600000
      - WORKSPACE_ROOT=/safe_workspace
    volumes:
      - ./backend:/app # Optional: for hot reloading/config access
      - /tmp/safe_workspace:/safe_workspace # Bind mount host /tmp/safe_workspace to container /safe_workspace

  frontend:
    build:
      context: ./frontend
      args:
        # Build-time variable for Next.js to bake in the backend URL
        NEXT_PUBLIC_API_URL: http://103.98.213.149:4531
    container_name: Lee-ai-code-platform-frontend
    restart: unless-stopped
    ports:
      - "4530:3012"
    networks:
      - Lee-network
    environment:
      # Runtime override if applicable (though Next.js normally bakes this at build)
      - NEXT_PUBLIC_API_URL=http://103.98.213.149:4531
    depends_on:
      - backend

networks:
  Lee-network:
    name: Lee-network
    driver: bridge
